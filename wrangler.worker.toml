name = "stock-signal-scanner-dev"
main = "cloudflare/worker.js"
compatibility_date = "2026-05-27"

[vars]
APP_ENV = "dev"
DEFAULT_TIMEFRAME = "1d"
DEFAULT_RISK = "1"
DEFAULT_ANCHOR_BARS = "120"
DEFAULT_STRATEGIES = "trend,breakout,volume_avwap,momentum"
ACCESS_CHECK_URL = "https://market-signal-ai-bot-dev.fnemoy.workers.dev/api/internal/access/check"
CORE_HMAC_KEY_ID = "scanner-dev-v2"

[[d1_databases]]
binding = "DB"
database_name = "stock_signal_scanner_dev"
database_id = "1111d17b-d208-44d1-bca4-c651ee65f54c"

[env.production]
name = "stock-signal-scanner-production"

[env.production.vars]
APP_ENV = "production"
DEFAULT_TIMEFRAME = "1d"
DEFAULT_RISK = "1"
DEFAULT_ANCHOR_BARS = "120"
DEFAULT_STRATEGIES = "trend,breakout,volume_avwap,momentum"

[[env.production.d1_databases]]
binding = "DB"
database_name = "stock_signal_scanner_production"
database_id = "e42468e1-eca6-41b1-aee6-5e59f08d678f"
