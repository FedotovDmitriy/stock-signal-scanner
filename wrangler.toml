name = "stock-signal-scanner-dev"
main = "cloudflare/worker.js"
compatibility_date = "2026-05-27"

[vars]
APP_ENV = "dev"
DEFAULT_TIMEFRAME = "1d"
DEFAULT_RISK = "1"
DEFAULT_ANCHOR_BARS = "120"
DEFAULT_STRATEGIES = "trend,breakout,volume_avwap,momentum"

[[d1_databases]]
binding = "DB"
database_name = "stock_signal_scanner_dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"

[env.production]
name = "stock-signal-scanner-production"

[env.production.vars]
APP_ENV = "production"
DEFAULT_TIMEFRAME = "1d"
DEFAULT_RISK = "1"
DEFAULT_ANCHOR_BARS = "120"
DEFAULT_STRATEGIES = "trend,breakout,volume_avwap,momentum"

[[env.production.d1_databases]]
binding = "DB"
database_name = "stock_signal_scanner_production"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
